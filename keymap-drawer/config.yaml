parse_config:
  mark_alternate_layer_activators: true
  sticky_label: $$mdi:gesture-tap-hold$$
  trans_legend:
    tap: $$mdi:layers-triple-outline$$
    type: trans

  raw_binding_map:
    # System & bootloader
    "&sys_reset":
      type: bootloader
      tap: $$mdi:backup-restore$$
    "&bootloader":
      type: bootloader
      tap: $$mdi:progress-download$$
    "&studio_unlock":
      tap: $$mdi:lock-open-outline$$
    "&caps_word": $$mdi:alpha-w-box$$

    # Power & Bluetooth
    "&out OUT_USB":
      shifted: $$mdi:usb$$
      tap: USB
    "&out OUT_BLE":
      shifted: $$mdi:bluetooth$$
      tap: BLE
    "&ext_power EP_OFF":
      tap: EP OFF
    "&ext_power EP_ON":
      tap: EP ON

    "&bt BT_SEL 0":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 1
    "&bt BT_SEL 1":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 2
    "&bt BT_SEL 2":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 3
    "&bt BT_SEL 3":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 4
    "&bt BT_SEL 4":
      shifted: $$mdi:bluetooth-connect$$
      tap: ""
      hold: 5
    "&bt BT_CLR":
      shifted: $$mdi:bluetooth-off$$
      tap: Clear

    # Empty
    "&none":
      tap: $$mdi:minus-circle-outline$$
      type: none

  zmk_combos:
    combo_ui_esc:
      align: top
      layers: ["L0 - BASE"]
    combo_fj_caps:
      align: top
      layers: ["L0 - BASE"]
    combo_lp_quote:
      align: top
      layers: ["L0 - BASE"]
    combo_l2_l4_to_l5:
      align: bottom
      layers: ["L5 - SYS"]

  zmk_keycode_map:
    # Modifiers
    LCTRL: $$mdi:apple-keyboard-control$$
    RCTRL: $$mdi:apple-keyboard-control$$
    LALT: $$mdi:apple-keyboard-option$$
    RALT: $$mdi:apple-keyboard-option$$
    LGUI: $$mdi:apple-keyboard-command$$
    RGUI: $$mdi:apple-keyboard-command$$
    LSHFT: $$mdi:apple-keyboard-shift$$
    RSHFT: $$mdi:apple-keyboard-shift$$

    # Whitespace & Navigation
    BSPC:
      tap: $$mdi:backspace$$
      type: backspace
    DEL:
      tap: $$mdi:backspace-reverse-outline$$
      type: backspace
    TAB: $$mdi:keyboard-tab$$
    ENTER: $$mdi:keyboard-return$$
    SPACE: $$mdi:keyboard-space$$
    ESC: $$mdi:keyboard-esc$$
    CAPS: $$mdi:apple-keyboard-caps$$

    LEFT: $$mdi:arrow-left$$
    DOWN: $$mdi:arrow-down$$
    UP: $$mdi:arrow-up$$
    RIGHT: $$mdi:arrow-right$$

    # Media & Brightness
    C_BRI_DN: $$mdi:brightness-4$$
    C_BRI_UP: $$mdi:brightness-7$$
    C_VOL_DN: $$mdi:volume-minus$$
    C_VOL_UP: $$mdi:volume-plus$$
    C_MUTE: $$mdi:volume-variant-off$$
    C_PREV: $$mdi:skip-previous$$
    C_NEXT: $$mdi:skip-next$$
    C_PP: $$mdi:play-pause$$

    # Numbers
    N1:
      tap: 1
      shifted: "!"
    N2:
      tap: 2
      shifted: "@"
    N3:
      tap: 3
      shifted: "#"
    N4:
      tap: 4
      shifted: "$"
    N5:
      tap: 5
      shifted: "%"
    N6:
      tap: 6
      shifted: "^"
    N7:
      tap: 7
      shifted: "&"
    N8:
      tap: 8
      shifted: "*"
    N9:
      tap: 9
      shifted: "("
    N0:
      tap: 0
      shifted: ")"

    # Punctuation & Symbols
    COMMA:
      tap: ","
      shifted: "?"
      left: "Б"
    DOT:
      tap: "."
      shifted: "!"
      left: "Ю"
    FSLH:
      tap: "/"
      shifted: "\\"
    SEMI:
      tap: ";"
      shifted: ":"
      left: "Ж"
    SQT:
      tap: "'"
      shifted: '"'
      left: "Э"
    MINUS:
      tap: "-"
      shifted: "_"
    EQUAL:
      tap: "="
      shifted: "+"
    LBKT:
      tap: "["
      shifted: "{"
    RBKT:
      tap: "]"
      shifted: "}"
    LBRC: "{"
    RBRC: "}"
    LPAR: "("
    RPAR: ")"
    AT: "@"
    HASH: "#"
    AMPS: "&"
    PIPE: "|"
    CARET: "^"
    PERCENT: "%"
    DOLLAR: "$"
    ASTERISK: "*"
    TILDE: "~"
    UNDER: "_"
    KP_SLASH: "/"
    KP_EQUAL: "="
    KP_MULTIPLY: "*"
    KP_DOT: "."

    # Alpha keys with bilingual Cyrillic sub-legends
    Q:
      tap: "Q"
      left: "Ї"
      right: "Й"
    W:
      tap: "W"
      right: "Ц"
    E:
      tap: "E"
      right: "У"
    R:
      tap: "R"
      right: "К"
    T:
      tap: "T"
      left: "Є"
      right: "Е"
    Y:
      tap: "Y"
      right: "Н"
    U:
      tap: "U"
      left: "Ґ"
      right: "Г"
    I:
      tap: "I"
      right: "Ш"
    O:
      tap: "O"
      right: "Щ"
    P:
      tap: "P"
      left: "Х"
      right: "З"
    A:
      tap: "A"
      right: "Ф"
    S:
      tap: "S"
      left: "І"
      right: "Ы"
    D:
      tap: "D"
      right: "В"
    F:
      tap: "F"
      right: "А"
    G:
      tap: "G"
      right: "П"
    H:
      tap: "H"
      right: "Р"
    J:
      tap: "J"
      right: "О"
    K:
      tap: "K"
      right: "Л"
    L:
      tap: "L"
      right: "Д"
    Z:
      tap: "Z"
      left: "Ë"
      right: "Я"
    X:
      tap: "X"
      right: "Ч"
    C:
      tap: "C"
      right: "С"
    V:
      tap: "V"
      right: "М"
    B:
      tap: "B"
      right: "И"
    N:
      tap: "N"
      right: "Т"
    M:
      tap: "M"
      left: "Ъ"
      right: "Ь"

    # Cyrillic layer translations
    KP_PLUS: "Ї"
    KP_MINUS: "Ґ"
    KP_N1: "Ю"
    KP_N2: "Ë"
    KP_N3: "Ъ"
    KP_N4: "Ж"
    KP_N5: "Х"
    KP_N6: "Э"
    KP_N7: "Б"
    KP_N8: "I"
    KP_N9: "Є"

draw_config:
  dark_mode: true
  use_local_cache: false

  # Key dimensions
  key_h: 80

  # Key border radius
  key_rx: 7
  key_ry: 7

  # Key labels line spacing
  line_spacing: 1.0

  # Combo box dimensions
  combo_w: 45
  combo_h: 45

  # Padding from edge of cap
  small_pad: 8

  legend_rel_y: 0
  legend_rel_x: 0
  inner_pad_w: 2
  inner_pad_h: 2

  outer_pad_w: 20
  outer_pad_h: 70

  append_colon_to_layer_header: false
  shrink_wide_legends: 5

  # Glyphs dimensions
  glyph_tap_size: 25
  glyph_hold_size: 22
  glyph_shifted_size: 21

  mark_alternate_layer_activators: true
  style_layer_activators: true
  svg_extra_style: |