# Supplementary combos configuration for Molekula layout
combos:

  # L3 conditional layer activation (thumbs 31 & 34)
  - p: [31, 34]
    layers: ["L3 - CYR"]
    k:
      t: L3
      # h: CYR
      # s: $$mdi:layers$$
    dendron: true
    align: bottom
    offset: 1

  # L5 sys layer activation (thumbs 31 & 35)
  - p: [31, 35]
    layers: ["L5 - SYS"]
    k:
      t: L5
      # h: SYS
      # s: $$mdi:layers$$
    dendron: true
    align: bottom
    offset: 1
