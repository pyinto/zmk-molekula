name: Draw Molekula TWS keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "boards/shields/molekula_tws/*.keymap"
      - "keymap-drawer/**"
      - "!keymap-drawer/molekula.svg"
      - "!keymap-drawer/molekula.yaml"
      - "justfile"
      - ".github/workflows/draw-keymaps.yml"

concurrency:
  group: draw-molekula-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Render current TWS keymap
        run: |
          cp .env.example .env
          just draw
      - name: Commit updated drawing
        run: |
          git add keymap-drawer/molekula.yaml keymap-drawer/molekula.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Molekula TWS keymap visualization"
          git push
